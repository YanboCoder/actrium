name = "loran-example-local"
enable = 31
env = "dev"
sqlite_path = "database"
loran_shared_key = "0123456789abcdef0123456789abcdef"
location_tag = "local,dev,examples"

[authority]
uri = "actr://localhost"

[bind]
[bind.http]
domain_name = "localhost"
advertised_ip = "127.0.0.1"
ip = "127.0.0.1"
port = 8081

[bind.ice]
advertised_ip = "127.0.0.1"
advertised_port = 3478
ip = "127.0.0.1"
port = 3478

[turn]
relay_port_range = "49152-65535"
realm = "loran.local"
turn_secret = "0123456789abcdef0123456789abcdef"

[services.signer]
[services.signer.storage]
backend = "sqlite"
[services.signer.storage.sqlite]

[services.issuer]
[services.issuer.server]
worker_id = 0
token_ttl_secs = 3600
# Development-only 32-byte renewal-token key.
renewal_token_secret = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

[services.signaling]
[services.signaling.server]
ws_path = "/signaling"

[control.admin_ui]
password_hash = "$argon2id$v=19$m=65536,t=2,p=1$YWN0cml4LXRlc3Qtc2FsdA$lfmjnm9CjoHQC9U79KOWXJkyWTUA7g5MhgG2DDPqe1E"

[recording]
