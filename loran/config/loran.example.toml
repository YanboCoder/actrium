# Loran Configuration Example
#
# Service enable bitmask (binary representation):
#   xxxxx
#   ││││└─ Signaling (00001 = 1)
#   │││└── STUN      (00010 = 2)
#   ││└─── TURN      (00100 = 4)
#   │└──── Issuer       (01000 = 8)
#   └───── Signer    (10000 = 16)
#
# All services are controlled by this bitmask. No individual enabled fields are needed.
#
# Examples:
#   63 (0b111111) = All services including WSS relay
#   31 (0b011111) = All original services without WSS relay
#   32 (0b100000) = WSS relay only
#   22 (0b10110) = KS + TURN + STUN (16+4+2)
#   6  (0b00110) = TURN + STUN (4+2)
#   4  (0b00100) = TURN only
#   2  (0b00010) = STUN only
#   1  (0b00001) = Signaling only
#   8  (0b01000) = Issuer only
#   16 (0b10000) = Signer only
enable = 31

# Instance identifier (used for monitoring and tracing)
name = "loran-01"

# Environment: dev/prod/test
# - dev: allows HTTP for local development
# - prod: enforces HTTPS, strict security
# - test: for automated testing
env = "prod"

# SQLite database storage directory path
# Main database file will be stored as {sqlite_path}/loran.db
sqlite_path = "database"

# Opaque deployment location label used only for observability.
# Realm v1 is single-node and does not use this for routing or HA.
location_tag = "single-node"

# Shared PSK for inter-service authentication.
# REQUIRED: replace this fail-closed placeholder before startup.
# Generate: openssl rand -hex 32
loran_shared_key = "<generate-with-openssl-rand-hex-32>"

# Public Actr authority. The URI is actr://<domain> without a port; its domain
# is the Actr Facility Provider ID, required when Issuer, Signaling or TURN is enabled.
# `enabled` serves /.well-known/actr (production requires TLS; the domain must
# match bind.http). `links` lists Realm link path prefixes, e.g. ["/i/"].
[authority]
enabled = false
uri = "actr://realm.example.com"
# links = ["/i/"]

# Realm hosting limits. One Loran instance hosts many Realms.
[realm]
# max_realms = 1              # pending + active Realms; unset = no limit
# max_publishers = 1000       # publishers register_publisher may register
# max_members_per_realm = 1000      # active members of a Realm
# max_clients_per_member = 20       # unrevoked Realm client keys of a member
# max_open_invites_per_realm = 100  # unused, unexpired invites of a Realm

# Recording pipeline (logging + tracing)
[recording]
# Global sink — default for all channels. Per-channel sink overrides below.
# Supported URI schemes: file://, otlp+http://, otlp+grpc://
# If omitted, output goes to stderr.
# sink = "file:///var/log/loran/loran.log"
service_name = "loran"

# Each channel has its own semantic filter and optional sink override.
# RUST_LOG env var overrides all per-channel filters (pass-all mode).

[recording.observability]
# Resolution: off / digest / detailed / full
filter = "digest"
# sink = "file:///var/log/loran/observability.log"

[recording.audit]
# Scope: off / mutations / all
filter = "mutations"         # only write actions (create/update/delete/rotate)
# sink = "otlp+http://127.0.0.1:4318/v1/logs"

[recording.security]
# Severity: off / critical / high / medium / all
filter = "all"               # security events should not be missed
# sink = "otlp+grpc://127.0.0.1:4317"

[recording.operations]
# Detail: off / lifecycle / detailed
filter = "lifecycle"         # start/stop, deploy, reload
# sink = "file:///var/log/loran/operations.log"

# ============================================================================
# Monitoring Endpoints (/health, /metrics)
# ============================================================================
# Two auth methods, usable independently or together (OR logic):
#   1. IP whitelist — CIDR notation (bare IP implies /32 or /128)
#   2. HTTP Basic Auth — htpasswd file (each line: user:password)
# When both are configured, matching either allows access.
# When neither is configured (default), endpoints are publicly accessible.
#
# Per-service overrides completely replace global config for that service.
[monitoring]
# allowed_ips = ["127.0.0.1/32", "10.0.0.0/8", "::1/128"]
# htpasswd_file = "/etc/loran/monitoring.htpasswd"

# Per-service override example:
# [monitoring.services.signer]
# allowed_ips = ["192.168.1.0/24"]
# htpasswd_file = ""  # disable Basic Auth for Signer endpoints

# Process management (optional)
# pid = "/var/run/loran.pid"  # (optional)
# user = "loran"  # (optional) Drop privileges to this user after binding ports
# group = "loran"  # (optional) Drop privileges to this group

# ============================================================================
# Network Binding Configuration
# ============================================================================

[bind]
# HTTP/HTTPS binding (unified)
# Production requires cert + key. Development may use plain HTTP.
[bind.http]
domain_name = "realm.example.com"
advertised_ip = "203.0.113.10"
ip = "::"
port = 8080
# advertised_port = 8080  # (optional, defaults to port)
cert = "/etc/loran/tls/fullchain.pem"
key = "/etc/loran/tls/privkey.pem"

# Dedicated Signer gRPC listener (SGN-02).
# The Signer signing oracle is served on its own listener instead of the shared
# bind.http port. When [bind.signer] is omitted the Signer defaults to
# loopback-only on bind.http.port + 1 (e.g. 8081 here), matching the
# services.signer.expose = "loopback" default. Uncomment to override.
# A non-loopback ip publishes the oracle and, in prod, requires Signer mTLS
# (services.signer.require_mtls = true with mtls_ca_cert/mtls_cert/mtls_key).
# [bind.signer]
# domain_name = "realm.example.com"
# advertised_ip = "127.0.0.1"
# ip = "127.0.0.1"
# port = 8081

# ICE services (STUN/TURN)
[bind.ice]
ip = "0.0.0.0"
port = 3478
# Advertised public IP (must be routable)
# Replace with your actual public IP
advertised_ip = "203.0.113.10"
# Advertised port (usually same as bind port)
advertised_port = 3478

# ============================================================================
# TURN Configuration
# ============================================================================
[turn]
# Relay port range for TURN data channels
# Format: start-end (e.g., "49152-65535")
# Larger range = more concurrent relay sessions
relay_port_range = "49152-65535"

# TURN realm
realm = "loran.example.com"
# REQUIRED: stable TURN secret. Rotating it invalidates outstanding TURN
# credentials, so rotate through an explicit maintenance procedure.
# Must be independent from every other secret in this file (no reuse).
# Generate: openssl rand -base64 48
turn_secret = "<generate-distinct-turn-secret-openssl-rand-base64-48>"

# ============================================================================
# Service Configuration (optional)
# ============================================================================
# All HTTP services share the instance-level HTTP/HTTPS port (bind.http).
#
# Signer configuration
# Service enablement is controlled by the bitmask (enable field)
# Set ENABLE_SIGNER bit (16) in the enable field to enable this service
[services.signer]
# Required in production. The environment value must be 32 random bytes
# encoded as 64 hex characters or 44-character Base64.
kek_env = "LORAN_SIGNER_KEK"

[services.signer.storage]
backend = "sqlite"

[services.signer.storage.sqlite]

# Issuer (Actor Identity Service) Configuration (optional)
# Service enablement is controlled by the bitmask (enable field)
# Set ENABLE_ISSUER bit (8) in the enable field to enable this service
[services.issuer]

[services.issuer.server]
# Stable allocation for this single node. A future multi-node deployment must
# assign a distinct worker_id (0..31) to each concurrent issuer.
worker_id = 0
# signaling_heartbeat_interval_secs = 30  # (optional, default: 30)
# token_ttl_secs = 3600  # (optional, default: 3600)
# Renewal token TTL in seconds (default: 86400 = 24 hours)
# renewal_token_ttl_secs = 86400
# Rotation window in seconds — when remaining lifetime drops below this
# threshold, a deterministic successor token is issued (default: 21600 = 6 hours)
# renewal_rotation_window_secs = 21600
# Base64-encoded secret for deterministic renewal token rotation.
# Must decode to at least 32 bytes. Must be identical across the loran cluster.
# Must be independent from every other secret in this file (no reuse).
# REQUIRED. Generate: openssl rand -base64 48
renewal_token_secret = "<generate-distinct-renewal-token-secret-openssl-rand-base64-48>"

# Issuer automatically uses the local Signer if enabled, or configure one explicitly:
# [services.issuer.dependencies.signer]
# endpoint = "https://signer.internal.example:8443"

# Content-addressed .actr hosting is an independent static download service.
# Each file is served at /actr/packages/artifact?sha256=<digest>, which a
# Realm Profile package.href may point to. It may run here even when this
# process does not serve the authority discovery document.
# [services.packages]
# artifacts = ["/srv/actr/packages/echo-ui-1.0.0.actr"]

# Signaling Service Configuration (optional)
# Service enablement is controlled by the bitmask (enable field)
# Set ENABLE_SIGNALING bit (1) in the enable field to enable this service
[services.signaling]

[services.signaling.server]
ws_path = "/signaling"

# Rate limiting configuration (optional, all have defaults)
# [services.signaling.server.rate_limit.connection]
# enabled = true  # (optional, default: true)
# per_minute = 5  # (optional, default: 5)
# burst_size = 10  # (optional, default: 10)
# max_concurrent_per_ip = 100  # (optional, default: 100)
#
# [services.signaling.server.rate_limit.message]
# enabled = true  # (optional, default: true)
# per_second = 10  # (optional, default: 10)
# burst_size = 50  # (optional, default: 50)

# Signaling dependencies (optional, auto-discovered if local services enabled)
# [services.signaling.dependencies.signer]
# endpoint = "https://signer.internal.example:8443"  # (optional, gRPC endpoint)
#
# [services.signaling.dependencies.issuer]
# endpoint = "http://remote-issuer:8080"  # (optional)

# ============================================================================
# Control Plane (always enabled, shared with main HTTP port)
# ============================================================================
[control]
# Control endpoints are enabled independently via [control.admin_ui].enabled
# and [control.grpc_api].enabled; both may run simultaneously on the shared
# HTTP port.
#
# Legacy override: set `head` to force a single endpoint and disable the other
# (mutually exclusive). Omit it (recommended) to control each endpoint with its
# own `enabled` flag.
#   head = "admin_ui"   # admin_ui on, grpc_api off
#   head = "grpc_api"   # grpc_api on, admin_ui off

[control.admin_ui]
# Enable the local web console under /admin (default: true).
enabled = true
# REQUIRED: Argon2id PHC string. Plaintext passwords are rejected.
# Example generation (argon2 CLI):
#   printf '%s' "$LORAN_ADMIN_PASSWORD" |
#     argon2 "$(openssl rand -base64 18)" -id -e -m 16 -t 3 -p 1
password_hash = "<generate-argon2id-phc>"
# JWT session expiry in seconds (default: 86400 = 24h)
session_expiry_secs = 86400

# Login token buckets and password-verification concurrency (no waiting queue).
[control.admin_ui.login_limits]
per_ip_per_minute = 30
per_ip_burst = 10
global_per_minute = 120
global_burst = 20
max_concurrent = 2

[control.grpc_api]
# Enable the supervisor-facing NodeAdminService gRPC API under
# /admin.v1.NodeAdminService/* (default: false). When enabled, the node is
# considered superv-managed: realms are pushed by superv and local realm
# writes (create/update/rotate/delete) through the Admin UI are disabled.
enabled = false
node_id = "loran-node-01"
node_name = "loran-edge-01"
# Shared secret (hex, >= 64 chars) used to sign mutable control-plane ops.
# Required only when grpc_api is enabled. Keep empty otherwise.
shared_secret = ""
max_clock_skew_secs = 300

# ============================================================================
# Production Configuration Example
# Multiplexed peer relay: add 32 to enable to host /relay/ws locally.
# auth="aid" uses the Realm-scoped trusted Issuer signing-key cache.
[relay]
auth = "aid"
# public_url = "wss://relay.example.org/relay/ws"
