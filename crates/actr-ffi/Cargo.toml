[package]
name = "libactr"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]
name = "actr"

[dependencies]
# actr dependencies (workspace members)
actr-protocol.workspace = true
actr-framework.workspace = true
actr-runtime.workspace = true
actr-hyper = { workspace = true, features = ["opentelemetry"] }
actr-config = { workspace = true, features = ["opentelemetry"] }
actr-pack.workspace = true

# UniFFI
uniffi = { version = "0.31.1", features = ["tokio"] }

# Async runtime
tokio = { version = "1.48", features = ["full", "rt-multi-thread"] }
bytes = "1.10"

# Utilities
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-android = "0.2"
tracing-oslog = { version = "0.2", optional = true }
url = "2.5"
async-trait = "0.1"
parking_lot = "0.12"
futures-util = "0.3.31"
ed25519-dalek.workspace = true
rand.workspace = true
zeroize = "1.8"
opus = "0.4.0"
opusic-sys = { version = "0.7.3", features = ["bundled"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"

[dev-dependencies]
actr-mock-loran = { workspace = true }
tempfile.workspace = true

[features]
# RTC status and observation APIs are always available.
default = []
opentelemetry = []
macos-oslog = ["tracing-oslog"]
