[package]
name = "actrium-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "actrium_core"
path = "src/lib.rs"

[dependencies]
actr-pack.workspace = true
actr-protocol.workspace = true
rand.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uniffi = { version = "0.29.2", features = ["cli"] }
url = "2"

[build-dependencies]
uniffi = { version = "0.29.2", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
